<div style="border:1px solid #d9dee5;border-radius:10px;padding:14px;margin:14px 0;background:#f7f9fc">
  <label for="ppf-url" style="font-size:.8rem;font-weight:600;display:block;margin-bottom:4px">1. Paste your <b>SKILL.md URL</b> (copy it from your portal &ldquo;Your microscope&rdquo; panel):</label>
  <input type="text" id="ppf-url" autocomplete="off" spellcheck="false"
         placeholder="https://ddls-gateway-....svc.hypha.aicell.io/v1/skill.md?token=..."
         style="width:100%;font-family:monospace;font-size:.8rem;padding:6px 8px;border:1px solid #cbd3dd;border-radius:6px;box-sizing:border-box">
  <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 4px">
    <span style="font-size:.8rem;font-weight:600">2. Your ready-to-paste Pi prompt <span style="font-weight:400;color:#66707d">(your URL is filled in below):</span></span>
    <button type="button" id="ppf-btn"
            style="font-size:.8rem;background:#0b62b4;color:#fff;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;white-space:nowrap">Copy</button>
  </div>
  <pre id="ppf-out" style="white-space:pre-wrap;word-break:break-word;font-family:'IBM Plex Mono',monospace;font-size:.78rem;line-height:1.45;background:#0b1220;color:#e6edf3;border-radius:8px;padding:12px;margin:0;overflow-x:auto"></pre>
  <div id="ppf-msg" style="font-size:.8rem;margin-top:6px;min-height:1em"></div>
  <p style="font-size:.75rem;color:#66707d;margin:8px 0 0">This sets up the <code>snap.py</code> helper only &mdash; you design the discovery loop (<code>pond.md</code>) yourself in Part 4, from your own brainstorm.</p>
</div>
<script>
(function(){
  var url=document.getElementById('ppf-url'), out=document.getElementById('ppf-out'),
      btn=document.getElementById('ppf-btn'), msg=document.getElementById('ppf-msg');
  if(!url||!out||!btn) return;
  var TMPL="Set up my Lab 6 microscope helper, then stop. Assume nothing beyond the files in this folder.\n\nSTEP 1 — Replace the Ralph loop extension (the one we first installed was the wrong package). Run in bash exactly: pi uninstall npm:@lnilluv/pi-ralph-loop 2>/dev/null; pi install npm:@rahulmutt/pi-ralph\n\nSTEP 2 — Write snap.py. Read my microscope doc at __URL__ . Write ./snap.py with the microscope token taken DIRECTLY from that URL and HARD-CODED in the file — never from an environment variable (an env var vanishes between loop iterations, which is what broke things). snap.py must: take an atomic snap (dx/dy, never move-then-snap), autofocus, and read status; save every frame full-resolution AND a thumbnail (<=768 px long side) into ./images and ./thumbs; read the scale once from /v1/status at result.scale.pixel_size_um; and back off / retry on 429 and 503. Do NOT touch my DDLS_API_KEY — that is only the model key, never the microscope. Then take ONE test brightfield snap of one of my wells and show me the thumbnail.\n\nWhen the test snap works (show me the thumbnail), STOP. I'll explore the scope by hand and design the discovery loop (pond.md) myself in Part 4 — don't write pond.md.";
  function current(){ var u=(url.value||'').trim(); return TMPL.replace('__URL__', u || '‹paste your SKILL.md URL above›'); }
  function render(){ out.textContent = current(); }
  url.addEventListener('input', render); render();
  btn.onclick=function(){
    var u=(url.value||'').trim();
    if(!u){ msg.textContent='Paste your SKILL.md URL above first.'; msg.style.color='#b8760c'; url.focus(); return; }
    navigator.clipboard.writeText(current()).then(function(){
      msg.textContent='Copied — paste it straight into Pi.'; msg.style.color='#0f7d78';
    }, function(){
      msg.textContent='Copy failed — select the prompt text and copy manually.'; msg.style.color='#b8760c';
    });
  };
})();
</script>
