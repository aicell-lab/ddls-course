[build]
  command = "hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.97.3"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = true

# The recruitment landing page moved from /forward-deployed-scientist/ to a name that says
# what it is. The old path was already published and shared, so keep it alive.
[[redirects]]
  from = "/forward-deployed-scientist/*"
  to = "/call-for-projects-2026/"
  status = 301
  force = true
